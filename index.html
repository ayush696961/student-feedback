<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Feedback</title><style>body{font:16px Arial,sans-serif;max-width:700px;margin:40px auto;padding:0 16px}label{display:block;margin-top:16px}input,textarea,button{box-sizing:border-box;width:100%;padding:10px;margin-top:6px;font:inherit}.entry{border:1px solid #ccc;border-radius:6px;padding:12px;margin:12px 0}.entry p{white-space:pre-wrap}button{margin-top:18px;cursor:pointer}#message{color:#b00020}</style></head>
<body><h1>Student Feedback</h1><form id="feedback-form"><label for="name">Name</label><input id="name" name="name" maxlength="100" required><label for="course">Course</label><input id="course" name="course" maxlength="100" required><label for="feedback">Feedback</label><textarea id="feedback" name="feedback" maxlength="2000" rows="5" required></textarea><button type="submit">Submit feedback</button></form><p id="message" role="alert"></p><h2>Submitted feedback</h2><div id="feedback-list"></div><script src="feedback.js"></script><script src="app.js"></script></body></html>
